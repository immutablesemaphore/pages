<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pages</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      color: #8b949e;
      line-height: 1.6;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #484f58;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>pages</h1>
    <p>A simple GitHub Pages site.</p>
  </main>
  <footer>
    Hosted on <a href="https://pages.github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub Pages (opens in a new tab)">GitHub Pages</a>
  </footer>
</body>
</html>
